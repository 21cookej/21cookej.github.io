<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>4D Hoxel Editor</title>
  <style>
    body { margin: 0; overflow: hidden; }
    #ui { position: absolute; top: 10px; left: 10px; z-index: 10; }
  </style>
</head>
<body>
  <div id="ui">
    <label>W slice: <input id="wSlice" type="range" min="0" max="15" value="0" /></label>
  </div>
  <canvas id="canvas"></canvas>
  <script type="module">
    import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';

    const canvas = document.getElementById('canvas');
    const renderer = new THREE.WebGLRenderer({ canvas });
    renderer.setSize(window.innerWidth, window.innerHeight);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(20, 20, 40);

    const grid = new HoxelGrid4D(16, 16, 16, 16); // you’d paste the class from above here

    // Example: fill some 4D voxels
    for (let w = 0; w < 16; w++) {
      grid.set(8, 8, 8, w, { filled: true, color: w });
    }

    const voxelGroup = new THREE.Group();
    scene.add(voxelGroup);

    function rebuildSlice(wSlice) {
      voxelGroup.clear();
      const slice = getSlice3D(grid, wSlice); // from above

      const geom = new THREE.BoxGeometry(1, 1, 1);
      const mat = new THREE.MeshLambertMaterial({ color: 0x00ffcc });

      let i = 0;
      for (let z = 0; z < slice.depth; z++) {
        for (let y = 0; y < slice.height; y++) {
          for (let x = 0; x < slice.width; x++) {
            const hoxel = slice.voxels[i++];
            if (!hoxel.filled) continue;
            const mesh = new THREE.Mesh(geom, mat);
            mesh.position.set(x, y, z);
            voxelGroup.add(mesh);
          }
        }
      }
    }

    const light = new THREE.DirectionalLight(0xffffff, 1);
    light.position.set(10, 20, 10);
    scene.add(light);

    const wSlider = document.getElementById('wSlice');
    wSlider.addEventListener('input', () => {
      rebuildSlice(parseInt(wSlider.value, 10));
    });

    rebuildSlice(0);

    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
